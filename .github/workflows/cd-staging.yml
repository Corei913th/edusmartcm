name: CD - Staging

on:
  push:
    branches: ["develop"]

defaults:
  run:
    working-directory: edusmart-api

jobs:
  deploy:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: edusmart-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edusmart-api:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/edusmart-api:${{ github.sha }}
